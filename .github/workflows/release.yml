name: Release

# Publishes a release and updates repository.json, the index Silo reads to
# install and auto-update this plugin. Start it by pushing a tag (vX.Y.Z), or
# from the Actions tab ("Run workflow"), which bumps the latest tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            latest=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
            IFS='.' read -r major minor patch <<< "${latest#v}"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
            case "${BUMP:-patch}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *) patch=$((patch + 1)) ;;
            esac
            [ -z "$latest" ] && { major=0; minor=1; patch=0; }
            tag="v${major}.${minor}.${patch}"
            git tag "$tag"
            git push origin "refs/tags/${tag}"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $tag is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Resolve modules
        run: go mod tidy

      - name: Test
        run: make check

      - name: Build release binaries
        run: make dist VERSION="${{ steps.version.outputs.version }}"

      - name: Build repository index
        run: make index VERSION="${{ steps.version.outputs.version }}" REPO="${{ github.repository }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release/plugin-linux-amd64
            release/plugin-linux-arm64
            release/plugin-darwin-arm64
            release/checksums.txt
            repository.json

      # Silo servers that added this repository pick the new version up on
      # their next update check, once the index on main names it.
      - name: Publish repository.json on main
        run: |
          set -euo pipefail
          cp repository.json "$RUNNER_TEMP/repository.json"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/repository.json" repository.json
          if git diff --quiet -- repository.json && git ls-files --error-unmatch repository.json >/dev/null 2>&1; then
            echo "repository.json already up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository.json
          git commit -m "release: ${{ steps.version.outputs.tag }}"
          git push origin main
